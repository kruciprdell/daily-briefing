name: daily-podcast

on:
  schedule:
    # Free Gemini voice quota resets at 07:00-08:00 UTC, so the backups run after that.
    # GitHub may delay cron runs by 10-30 min.
    - cron: "45 8 * * *"
    # Backup run one hour later. generate.py skips it if today's episode already exists.
    - cron: "45 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate today's episode even if it exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-podcast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -r requirements.txt
          ffmpeg -version

      - name: Restore previous site (episodes + state) from gh-pages
        run: |
          mkdir -p site
          if git fetch --depth=1 origin gh-pages; then
            git archive FETCH_HEAD | tar -x -C site
          else
            echo "No gh-pages branch yet - first run."
          fi

      - name: Generate episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FEED_DIR: ${{ vars.FEED_DIR || 'podcast' }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: python generate.py --site site

      - name: Publish as a 
single-commit gh-pages branch (keeps repo small)
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Episode $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Keepalive (monthly 
commit so GitHub never pauses the schedule)
        continue-on-error: true
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt 2592000 ]; then
            echo "$(date -u +%FT%TZ)" > keepalive.txt
            git config user.name "podcast-bot"
            git config user.email "podcast-bot@users.noreply.github.com"
            git add keepalive.txt
            git commit -q -m "keepalive"
            git push origin HEAD:main
          fi
